<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STV FIT — Now Playing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #080909;
      --lime:   #c8f000;
      --red:    #c0392b;
      --gold:   #c8a96e;
      --panel:  rgba(8,9,9,0.82);
      --mid:    #1c1e1c;
      --text:   #eef2e0;
      --muted:  #5a6050;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 0.02em;
      overflow: hidden;
    }

    /* ── SHELL ──────────────────────────────────────── */
    .widget {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      min-height: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--black);
    }

    /* ── VIDEO BG ───────────────────────────────────── */
    .video-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      filter: saturate(1.3) contrast(1.05);
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8,9,9,0.55) 0%,
        rgba(8,9,9,0.2) 35%,
        rgba(8,9,9,0.6) 70%,
        rgba(8,9,9,0.95) 100%
      );
    }

    /* ── SWAP BUTTON ────────────────────────────────── */
    .swap-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(8,9,9,0.75);
      border: 1px solid var(--lime);
      color: var(--lime);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .swap-btn:hover { background: var(--lime); color: var(--black); }

    .swap-panel {
      display: none;
      position: absolute;
      top: 34px;
      right: 10px;
      z-index: 30;
      background: rgba(8,9,9,0.96);
      border: 1px solid #2a2e2a;
      padding: 12px;
      width: 220px;
      flex-direction: column;
      gap: 8px;
    }
    .swap-panel.open { display: flex; }
    .swap-panel label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--lime);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .swap-panel input[type=text] {
      width: 100%;
      background: var(--mid);
      border: 1px solid #333;
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
    }
    .swap-panel input[type=text]:focus { border-color: var(--lime); }
    .swap-apply {
      background: var(--lime);
      color: var(--black);
      border: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px;
      cursor: pointer;
    }
    .swap-apply:hover { opacity: 0.85; }
    .swap-file-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .swap-file-label {
      flex: 1;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input[type=file]#vid-file { display: none; }
    .file-pick-btn {
      background: var(--mid);
      border: 1px solid #333;
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-pick-btn:hover { border-color: var(--lime); color: var(--lime); }

    /* ── CONTENT (layered above video) ──────────────── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── HEADER ─────────────────────────────────────── */
    .header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .brand-stack { line-height: 1; }
    .brand-eye {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--lime);
      text-transform: uppercase;
    }
    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 0.08em;
      color: var(--text);
      line-height: 0.95;
    }
    .brand-name span { color: var(--lime); }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--red);
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── SPACER (pushes controls down) ─────────────── */
    .spacer { flex: 1; }

    /* ── STAT STRIP ─────────────────────────────────── */
    .stat-strip {
      display: flex;
      gap: 0;
      padding: 0 16px 12px;
    }
    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid #1e2018;
      padding: 6px 0;
    }
    .stat:last-child { border-right: none; }
    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--lime);
      line-height: 1;
    }
    .stat-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── NOW PLAYING ────────────────────────────────── */
    .now-playing {
      background: var(--panel);
      padding: 10px 16px 8px;
      border-top: 1px solid #1e2018;
      border-bottom: 1px solid #1e2018;
    }
    .np-label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--lime);
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .np-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── PROGRESS ───────────────────────────────────── */
    .progress-wrap {
      background: var(--panel);
      padding: 6px 16px 4px;
    }
    .progress-track {
      width: 100%;
      height: 2px;
      background: #1e2018;
      position: relative;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: var(--lime);
      width: 0%;
      transition: width 0.25s linear;
      pointer-events: none;
    }
    input[type=range].scrub {
      position: absolute;
      inset: -7px 0;
      width: 100%;
      height: 16px;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    /* ── CONTROLS ───────────────────────────────────── */
    .controls {
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 16px;
    }
    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.12s, transform 0.1s;
    }
    .btn:hover { color: var(--lime); transform: scale(1.12); }
    .btn:active { transform: scale(0.94); }
    .btn.active { color: var(--lime); }
    .btn-play {
      width: 48px;
      height: 48px;
      border-radius: 0;
      background: var(--lime);
      color: var(--black);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.1s;
      clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
    }
    .btn-play:hover { background: #d8ff20; transform: scale(1.06); }
    .btn-play:active { transform: scale(0.96); }

    /* ── VOLUME ─────────────────────────────────────── */
    .volume-row {
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 10px;
    }
    .vol-icon { color: var(--muted); font-size: 12px; }
    input[type=range].vol {
      flex: 1;
      height: 2px;
      accent-color: var(--lime);
      cursor: pointer;
    }
    .vol-pct { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; min-width: 26px; text-align: right; }

    /* ── PLAYLIST ───────────────────────────────────── */
    .playlist-header {
      background: rgba(8,9,9,0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px 6px;
      border-top: 1px solid #1e2018;
    }
    .pl-label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; color: var(--lime); text-transform: uppercase; }
    .pl-count { font-size: 9px; color: var(--muted); letter-spacing: 0.06em; }
    .playlist {
      flex: 1;
      overflow-y: auto;
      background: rgba(8,9,9,0.88);
      scrollbar-width: thin;
      scrollbar-color: #1e2018 transparent;
      max-height: 150px;
    }
    .pl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      cursor: pointer;
      border-bottom: 1px solid #111312;
      transition: background 0.1s;
    }
    .pl-item:hover { background: rgba(200,240,0,0.05); }
    .pl-item.active { background: rgba(200,240,0,0.08); }
    .pl-num { font-size: 9px; color: var(--muted); min-width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
    .pl-item.active .pl-num { color: var(--lime); }
    .pl-name { flex: 1; font-size: 12px; font-weight: 400; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-item.active .pl-name { color: var(--lime); font-weight: 600; }
    .pl-icon { font-size: 8px; color: var(--lime); opacity: 0; }
    .pl-item.active .pl-icon { opacity: 1; }

    /* ── FOOTER ─────────────────────────────────────── */
    .footer {
      background: rgba(8,9,9,0.96);
      padding: 8px 16px;
      border-top: 1px solid #1e2018;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-links { display: flex; gap: 10px; }
    .footer-links a {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.12s;
    }
    .footer-links a:hover { color: var(--lime); }
    .footer-tag { font-size: 8px; color: #222; letter-spacing: 0.1em; }

    .status-msg { padding: 16px; text-align: center; font-size: 11px; color: var(--muted); }
    .status-msg.error { color: var(--red); }
  </style>
</head>
<body>

<div class="widget">

  <!-- VIDEO BACKGROUND -->
  <div class="video-wrap">
    <video id="bg-video" autoplay muted loop playsinline>
      <source src="Stvfitcat.MOV" type="video/quicktime" />
      <source src="Stvfitcat.MOV" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- SWAP VIDEO BUTTON -->
  <button class="swap-btn" id="swap-toggle">⟳ SWAP VIDEO</button>
  <div class="swap-panel" id="swap-panel">
    <label>Paste video URL</label>
    <input type="text" id="vid-url" placeholder="https://…/video.mp4" />
    <div class="swap-file-row">
      <button class="file-pick-btn" onclick="document.getElementById('vid-file').click()">Upload file</button>
      <span class="swap-file-label" id="file-label">or upload from device</span>
    </div>
    <input type="file" id="vid-file" accept="video/*" />
    <button class="swap-apply" id="swap-apply">Apply</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="header">
      <div class="brand-stack">
        <div class="brand-eye">G4E Movement Studio</div>
        <div class="brand-name">STV <span>FIT</span></div>
      </div>
      <div class="live-pill"><div class="live-dot"></div> On Air</div>
    </div>

    <div class="spacer"></div>

    <!-- STAT STRIP -->
    <div class="stat-strip" id="stat-strip">
      <div class="stat"><div class="stat-val" id="stat-track">—</div><div class="stat-lbl">Track</div></div>
      <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-val" id="stat-time">0:00</div><div class="stat-lbl">Elapsed</div></div>
    </div>

    <!-- NOW PLAYING -->
    <div class="now-playing">
      <div class="np-label">Now Playing</div>
      <div class="np-title" id="np-title">Loading station…</div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <input type="range" class="scrub" id="scrub" min="0" max="100" value="0" step="0.1" />
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="btn active" id="btn-shuffle" title="Shuffle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="btn" id="btn-prev" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/></svg>
      </button>
      <button class="btn-play" id="btn-play" title="Play/Pause">
        <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="btn" id="btn-next" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/></svg>
      </button>
      <button class="btn active" id="btn-repeat" title="Repeat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>

    <!-- VOLUME -->
    <div class="volume-row">
      <span class="vol-icon">🔊</span>
      <input type="range" class="vol" id="vol" min="0" max="100" value="80" />
      <span class="vol-pct" id="vol-pct">80%</span>
    </div>

    <!-- PLAYLIST -->
    <div class="playlist-header">
      <span class="pl-label">Playlist</span>
      <span class="pl-count" id="pl-count">Loading…</span>
    </div>
    <div class="playlist" id="playlist">
      <div class="status-msg" id="pl-status">Scanning station…</div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-links">
        <a href="https://kick.com/STVNETWORK" target="_blank" rel="noopener">Kick</a>
        <a href="https://www.youtube.com/@STVRADIOMELTDOWN" target="_blank" rel="noopener">YouTube</a>
        <a href="https://fairefaretravels.github.io/radiomeltdownorg/" target="_blank" rel="noopener">Radio</a>
        <a href="https://www.tiktok.com/@sanecatv" target="_blank" rel="noopener">@SanecaTV</a>
      </div>
      <span class="footer-tag">STV FIT</span>
    </div>

  </div><!-- /content -->
</div>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
  const REPO_OWNER = 'fairefaretravels';
  const REPO_NAME  = 'radiomeltdownorg';
  const RAW_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/`;
  const API_URL    = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
  const AUDIO_EXTS = ['.mp3','.ogg','.wav','.flac','.m4a','.aac'];

  let tracks=[], queue=[], currentIdx=0, shuffleOn=true, repeatOn=true, loaded=false;

  const audio         = document.getElementById('audio');
  const npTitle       = document.getElementById('np-title');
  const progressFill  = document.getElementById('progress-fill');
  const scrub         = document.getElementById('scrub');
  const timeCur       = document.getElementById('time-cur');
  const timeDur       = document.getElementById('time-dur');
  const statTrack     = document.getElementById('stat-track');
  const statTotal     = document.getElementById('stat-total');
  const statTime      = document.getElementById('stat-time');
  const btnPlay       = document.getElementById('btn-play');
  const playIcon      = document.getElementById('play-icon');
  const pauseIcon     = document.getElementById('pause-icon');
  const btnPrev       = document.getElementById('btn-prev');
  const btnNext       = document.getElementById('btn-next');
  const btnShuffle    = document.getElementById('btn-shuffle');
  const btnRepeat     = document.getElementById('btn-repeat');
  const volSlider     = document.getElementById('vol');
  const volPct        = document.getElementById('vol-pct');
  const plContainer   = document.getElementById('playlist');
  const plStatus      = document.getElementById('pl-status');
  const plCount       = document.getElementById('pl-count');
  const bgVideo       = document.getElementById('bg-video');

  /* ── VIDEO SWAP ──────────────────────────────────── */
  document.getElementById('swap-toggle').addEventListener('click', () => {
    document.getElementById('swap-panel').classList.toggle('open');
  });
  document.getElementById('vid-file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    document.getElementById('file-label').textContent = f.name;
    document.getElementById('vid-url').value = '';
    document.getElementById('swap-apply').dataset.blob = URL.createObjectURL(f);
  });
  document.getElementById('swap-apply').addEventListener('click', () => {
    const url = document.getElementById('vid-url').value.trim()
              || document.getElementById('swap-apply').dataset.blob || '';
    if (!url) return;
    bgVideo.src = url;
    bgVideo.load();
    bgVideo.play().catch(()=>{});
    document.getElementById('swap-panel').classList.remove('open');
  });

  /* ── PLAYLIST LOAD ───────────────────────────────── */
  function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  async function loadPlaylist() {
    try {
      const res = await fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const files = await res.json();
      tracks = files
        .filter(f => f.type==='file' && AUDIO_EXTS.some(e => f.name.toLowerCase().endsWith(e)))
        .map(f => ({ name: f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), url: RAW_BASE+encodeURIComponent(f.name) }));
      if (!tracks.length) { plStatus.textContent='No audio files found.'; plStatus.classList.add('error'); return; }
      queue = shuffleOn ? shuffle([...tracks]) : [...tracks];
      plStatus.remove();
      renderPlaylist();
      plCount.textContent = `${tracks.length} tracks`;
      statTotal.textContent = tracks.length;
      loadTrack(0, false);
      loaded = true;
    } catch(err) {
      plStatus.textContent = `Couldn't load: ${err.message}`;
      plStatus.classList.add('error');
    }
  }
  function renderPlaylist() {
    plContainer.innerHTML = '';
    queue.forEach((t,i) => {
      const el = document.createElement('div');
      el.className = 'pl-item' + (i===currentIdx?' active':'');
      el.innerHTML = `<span class="pl-num">${String(i+1).padStart(2,'0')}</span><span class="pl-name">${t.name}</span><span class="pl-icon">▶</span>`;
      el.addEventListener('click', ()=>loadTrack(i,true));
      plContainer.appendChild(el);
    });
  }
  function updateActive() {
    plContainer.querySelectorAll('.pl-item').forEach((el,i)=>el.classList.toggle('active',i===currentIdx));
    const a = plContainer.querySelector('.pl-item.active');
    if(a) a.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  function loadTrack(idx, autoplay=true) {
    currentIdx = idx;
    const t = queue[idx];
    audio.src = t.url;
    npTitle.textContent = t.name;
    statTrack.textContent = idx+1;
    updateActive();
    progressFill.style.width='0%'; scrub.value=0;
    timeCur.textContent='0:00'; timeDur.textContent='0:00';
    if(autoplay) audio.play().catch(()=>{}); else audio.load();
  }
  function fmt(s) { if(!isFinite(s)) return '0:00'; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

  audio.addEventListener('play', ()=>{ document.body.classList.add('playing'); playIcon.style.display='none'; pauseIcon.style.display=''; });
  audio.addEventListener('pause', ()=>{ document.body.classList.remove('playing'); playIcon.style.display=''; pauseIcon.style.display='none'; });
  audio.addEventListener('ended', ()=>{ if(repeatOn||currentIdx<queue.length-1) loadTrack((currentIdx+1)%queue.length,true); });
  audio.addEventListener('timeupdate', ()=>{
    if(!audio.duration) return;
    const p=(audio.currentTime/audio.duration)*100;
    progressFill.style.width=p+'%'; scrub.value=p;
    timeCur.textContent=fmt(audio.currentTime);
    statTime.textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', ()=>{ timeDur.textContent=fmt(audio.duration); });
  scrub.addEventListener('input', ()=>{ if(audio.duration) audio.currentTime=(scrub.value/100)*audio.duration; });
  audio.volume=0.8;
  volSlider.addEventListener('input', ()=>{ audio.volume=volSlider.value/100; volPct.textContent=volSlider.value+'%'; });
  btnPlay.addEventListener('click', ()=>{ if(!loaded) return; audio.paused?audio.play().catch(()=>{}):audio.pause(); });
  btnPrev.addEventListener('click', ()=>{ if(!loaded) return; if(audio.currentTime>3){audio.currentTime=0;return;} loadTrack((currentIdx-1+queue.length)%queue.length,true); });
  btnNext.addEventListener('click', ()=>{ if(!loaded) return; loadTrack((currentIdx+1)%queue.length,true); });
  btnShuffle.addEventListener('click', ()=>{
    shuffleOn=!shuffleOn; btnShuffle.classList.toggle('active',shuffleOn);
    const cur=queue[currentIdx];
    queue=shuffleOn?shuffle([...tracks]):[...tracks];
    currentIdx=queue.findIndex(t=>t.url===cur.url); if(currentIdx<0)currentIdx=0;
    renderPlaylist(); updateActive();
  });
  btnRepeat.addEventListener('click', ()=>{ repeatOn=!repeatOn; btnRepeat.classList.toggle('active',repeatOn); });

  loadPlaylist();
</script>
</body>
</html>
